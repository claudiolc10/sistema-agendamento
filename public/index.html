<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Consulta</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
    h1 { font-size: 24px; margin-bottom: 8px; color: #1a1a2e; }
    p { font-size: 14px; color: #888; margin-bottom: 28px; }
    label { font-size: 13px; font-weight: bold; color: #444; display: block; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
    button { width: 100%; background: #e94f37; color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    button:hover { background: #c43628; }
    .mensagem { margin-top: 16px; text-align: center; font-size: 14px; color: green; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Agendar Consulta</h1>
    <p>Preencha os dados abaixo e entraremos em contato.</p>

    <label>Nome completo</label>
    <input type="text" id="nome" placeholder="Seu nome">

    <label>Telefone</label>
    <input type="tel" id="telefone" placeholder="(21) 99999-0000">

    <label>Data</label>
    <input type="date" id="data">

    <label>Horário</label>
    <input type="time" id="horario">

    <label>Serviço</label>
    <select id="servico">
      <option value="">Selecione...</option>
      <option value="musculacao">Musculação</option>
      <option value="emagrecimento">Emagrecimento</option>
      <option value="reabilitacao">Reabilitação</option>
      <option value="online">Treino Online</option>
    </select>

    <button onclick="agendar()">Confirmar Agendamento</button>
    <div class="mensagem" id="mensagem">✅ Agendamento realizado com sucesso!</div>
  </div>

  <script>
    async function agendar() {
      const nome = document.getElementById('nome').value;
      const telefone = document.getElementById('telefone').value;
      const data = document.getElementById('data').value;
      const horario = document.getElementById('horario').value;
      const servico = document.getElementById('servico').value;

      if (!nome || !telefone || !data || !horario || !servico) {
        alert('Preencha todos os campos!');
        return;
      }

      const response = await fetch('/api/agendamentos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, telefone, data, horario, servico })
      });

      const resultado = await response.json();

      if (resultado.mensagem) {
        document.getElementById('mensagem').style.display = 'block';
      }
    }
  </script>
</body>
</html>
