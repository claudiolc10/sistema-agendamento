<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendar Consulta</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06060f;
    --accent-1: #7c3aed;
    --accent-2: #db2777;
    --accent-3: #06b6d4;
    --text: #f0f0f0;
    --text-muted: #888;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }

  /* Mesh background */
  .mesh {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, #7c3aed22 0%, transparent 55%),
      radial-gradient(ellipse at 80% 70%, #db277722 0%, transparent 55%),
      radial-gradient(ellipse at 60% 10%, #06b6d422 0%, transparent 50%),
      #06060f;
    z-index: 0;
  }

  /* Grain */
  body::after {
    content: '';
    position: fixed;
    inset: -50%;
    width: 200%; height: 200%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    opacity: 0.035;
    pointer-events: none;
    z-index: 9999;
  }

  /* Floating orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
    animation: float 8s ease-in-out infinite;
  }
  .orb-1 { width: 300px; height: 300px; background: var(--accent-1); top: -100px; left: -100px; animation-delay: 0s; }
  .orb-2 { width: 250px; height: 250px; background: var(--accent-2); bottom: -80px; right: -80px; animation-delay: -3s; }
  .orb-3 { width: 200px; height: 200px; background: var(--accent-3); top: 50%; left: 60%; animation-delay: -5s; }

  @keyframes float {
    0%,100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-30px) scale(1.05); }
  }

  /* Card */
  .card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 460px;
    margin: 40px auto;
    padding: 48px 40px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    opacity: 0;
    transform: translateY(40px);
    animation: cardIn 0.9s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(124,58,237,0.15);
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 500;
    color: #a78bfa;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .badge::before { content: '●'; font-size: 8px; color: #7c3aed; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #fff 0%, #a78bfa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 36px;
    line-height: 1.6;
  }

  .field { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  input, select {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    transition: all 0.3s ease;
    outline: none;
    -webkit-appearance: none;
  }

  input::placeholder { color: rgba(255,255,255,0.25); }

  input:focus, select:focus {
    border-color: rgba(124,58,237,0.5);
    background: rgba(124,58,237,0.08);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.15), 0 0 20px rgba(124,58,237,0.1);
  }

  select option { background: #1a1a2e; color: #fff; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn {
    width: 100%;
    padding: 16px;
    margin-top: 8px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.3s;
    box-shadow: 0 8px 30px rgba(124,58,237,0.4), 0 0 60px rgba(219,39,119,0.2);
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 50px rgba(124,58,237,0.5), 0 0 80px rgba(219,39,119,0.3); }
  .btn:hover::before { opacity: 1; }
  .btn:active { transform: translateY(0); }

  .success {
    display: none;
    text-align: center;
    padding: 20px;
    background: rgba(6,182,212,0.1);
    border: 1px solid rgba(6,182,212,0.2);
    border-radius: 12px;
    margin-top: 16px;
    color: #67e8f9;
    font-size: 14px;
  }
  .success .icon { font-size: 28px; margin-bottom: 8px; }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    margin: 28px 0;
  }

  .info { display: flex; gap: 16px; justify-content: center; }
  .info-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
  .info-item span { font-size: 14px; }

  @media (max-width: 520px) {
    .card { padding: 32px 24px; margin: 20px; }
    .row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="mesh"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="card">
    <div class="badge">Agendamento Online</div>
    <h1>Reserve sua sessão</h1>
    <p class="subtitle">Preencha os dados abaixo e entraremos em contato para confirmar.</p>

    <div class="field">
      <label>Nome completo</label>
      <input type="text" id="nome" placeholder="Seu nome">
    </div>

    <div class="field">
      <label>Telefone</label>
      <input type="tel" id="telefone" placeholder="(21) 99999-0000">
    </div>

    <div class="row">
      <div class="field">
        <label>Data</label>
        <input type="date" id="data">
      </div>
      <div class="field">
        <label>Horário</label>
        <input type="time" id="horario">
      </div>
    </div>

    <div class="field">
      <label>Serviço</label>
      <select id="servico">
        <option value="">Selecione o serviço...</option>
        <option value="musculacao">🏋️ Musculação</option>
        <option value="emagrecimento">🏃 Emagrecimento</option>
        <option value="reabilitacao">🧘 Reabilitação</option>
        <option value="online">📱 Treino Online</option>
      </select>
    </div>

    <button class="btn" onclick="agendar()">Confirmar Agendamento →</button>

    <div class="success" id="success">
      <div class="icon">✅</div>
      <strong>Agendamento realizado!</strong><br>
      Entraremos em contato em breve.
    </div>

    <div class="divider"></div>

    <div class="info">
      <div class="info-item"><span>🔒</span> 100% seguro</div>
      <div class="info-item"><span>⚡</span> Resposta rápida</div>
      <div class="info-item"><span>✨</span> Sem compromisso</div>
    </div>
  </div>

  <script>
    async function agendar() {
      const nome = document.getElementById('nome').value;
      const telefone = document.getElementById('telefone').value;
      const data = document.getElementById('data').value;
      const horario = document.getElementById('horario').value;
      const servico = document.getElementById('servico').value;

      if (!nome || !telefone || !data || !horario || !servico) {
        const card = document.querySelector('.card');
        card.style.transition = 'transform 0.1s';
        card.style.transform = 'translateX(-8px)';
        setTimeout(() => card.style.transform = 'translateX(8px)', 100);
        setTimeout(() => card.style.transform = 'translateX(-4px)', 200);
        setTimeout(() => card.style.transform = 'translateX(0)', 300);
        return;
      }

      const btn = document.querySelector('.btn');
      btn.textContent = 'Enviando...';
      btn.style.opacity = '0.7';

      try {
        const response = await fetch('/api/agendamentos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, telefone, data, horario, servico })
        });
        const resultado = await response.json();
        if (resultado.mensagem) {
          document.getElementById('success').style.display = 'block';
          btn.textContent = 'Agendado! ✓';
          btn.style.background = 'linear-gradient(135deg, #059669, #06b6d4)';
          btn.style.opacity = '1';
        }
      } catch(e) {
        btn.textContent = 'Confirmar Agendamento →';
        btn.style.opacity = '1';
      }
    }
  </script>
</body>
</html>
